# Minimal low-dimensional Diffusion Policy template for DEXTRAH Franka cube BC.
# Based on official real-stanford/diffusion_policy low_dim config conventions:
# https://github.com/real-stanford/diffusion_policy
# https://diffusion-policy.cs.columbia.edu/

_target_: diffusion_policy.workspace.train_diffusion_unet_lowdim_workspace.TrainDiffusionUnetLowdimWorkspace

name: train_diffusion_unet_lowdim
task_name: franka_cube_lowdim
exp_name: franka_cube_dp_bc_warmstart

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
obs_dim: 21
action_dim: 7
obs_as_global_cond: true
obs_as_local_cond: false
pred_action_steps_only: false
past_action_visible: false

policy:
  _target_: diffusion_policy.policy.diffusion_unet_lowdim_policy.DiffusionUnetLowdimPolicy
  action_dim: ${action_dim}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_dim: ${obs_dim}
  obs_as_global_cond: ${obs_as_global_cond}
  obs_as_local_cond: ${obs_as_local_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: true
  num_inference_steps: 25
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  model:
    _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: ${action_dim}
    global_cond_dim: 42
    diffusion_step_embed_dim: 128
    down_dims: [128, 256, 512]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: true
    local_cond_dim: null

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-06

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false

val_dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: false
  pin_memory: false
  persistent_workers: false

task:
  name: franka_cube_lowdim
  task_name: franka_cube
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  dataset_path: data/franka_cube_dp_bc/franka_cube_lowdim_demos.npz
  dataset:
    _target_: dextrah_lab.offline_dp_bc.dp_dataset.FrankaCubeLowdimDataset
    dataset_path: ${task.dataset_path}
    horizon: ${horizon}
    pad_before: 1
    pad_after: 7
    seed: 42
    val_ratio: 0.1
    action_normalizer: identity
  env_runner:
    _target_: dextrah_lab.offline_dp_bc.dp_dataset.NoopLowdimRunner
    metric_prefix: test

training:
  seed: 42
  device: cuda:0
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 100
  num_epochs: 1
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 1
  val_every: 1
  sample_every: 1
  checkpoint_every: 1
  max_train_steps: 1
  max_val_steps: 1
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  name: franka_cube_dp_bc_warmstart
  group: null
  id: null
  mode: offline
  resume: false
  tags:
    - train_diffusion_unet_lowdim
    - franka_cube_lowdim
    - dextrah_bc_warmstart

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: a2c_rgb_resnet
    separate: False
    rgb:
      robot_proprio_dim: 33
      image_channels: 3
      image_height: 240
      image_width: 320
      visual_features: 32
      pretrained: True
      use_group_norm: False
      train_backbone: True
      encoder_batch_size: 32
      backbone_dtype: bfloat16
      running_mean_img: True
      clamp_input: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: dextrah_franka_multi_object_rgb_grasp
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.012
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 25
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0005
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 4096
    mini_epochs: 3
    critic_coef: 4
    clip_value: True
    seq_length: 4
    bound_loss_type: regularization
    bounds_loss_coef: 0.001

    player:
      deterministic: True
      games_num: 100000
      print_stats: True

wandb_activate: False
wandb_group: 'rl_gpu'
wandb_name: 'franka_multi_object_rgb_grasp_'
wandb_entity: 'nvidia'
wandb_project: 'dextrah-franka-multi-object-rgb-grasp'
wandb_tags: ['franka', 'multi-object-grasp', 'graspgen', 'rgb', 'resnet18', 'ik']

hydra:
  output_subdir: null
  run:
    dir: .

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: dextrah_franka_cube_grasp
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.012
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 25
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0005
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 64
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 4
    bound_loss_type: regularization
    bounds_loss_coef: 0.001

    central_value_config:
      minibatch_size: 32768
      mini_epochs: 4
      learning_rate: 1.0e-4
      kl_threshold: 0.012
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 100000
      print_stats: True

wandb_activate: False
wandb_group: 'rl_gpu'
wandb_name: 'franka_cube_grasp_'
wandb_entity: 'nvidia'
wandb_project: 'dextrah-franka-cube-grasp'
wandb_tags: ['franka', 'cube-grasp', 'state', 'ik']

hydra:
  output_subdir: null
  run:
    dir: .
